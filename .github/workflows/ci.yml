name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax-check frontend JavaScript
        run: |
          for f in frontend/js/*.js; do
            node --check "$f" || exit 1
          done

      - name: Skip contract-typing for the vendored Next.js console
        run: echo "sentinel-ui has its own toolchain (npm ci + tsc) in the sentinel-ui job below"

      - name: Run pytest
        env:
          PREPARED_DB_URL: https://github.com/shaikmohammedyasin-create/HHGoa26-Agentic-Fraud-Investigation/releases/download/data-v1/investigation.db
        run: python -m pytest -q --no-header

  sentinel-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sentinel-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sentinel-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
